name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test the library and CLI
        run: dotnet test Dimensions.slnx --nologo
      - name: Validate and plan the example dimension
        run: |
          dotnet run --project src/Dimensions.Cli --no-build -- validate examples/Ashfall
          dotnet run --project src/Dimensions.Cli --no-build -- plan examples/Ashfall -o plan.json
      - name: Editor script (syntax and name helpers)
        working-directory: unreal/Python
        run: |
          python -m py_compile dimensions_apply.py dimensions_names.py
          python -m unittest -q
